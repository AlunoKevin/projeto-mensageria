apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: mensageria
spec:
  replicas: 1

  selector:
    matchLabels:
      app: rabbitmq

  template:
    metadata:
      labels:
        app: rabbitmq

    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management

          ports:
            - containerPort: 5672
            - containerPort: 15672
            - containerPort: 15692

---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: mensageria
  labels:
    app: rabbitmq

spec:
  selector:
    app: rabbitmq

  ports:
    - name: amqp
      port: 5672
      targetPort: 5672

    - name: management
      port: 15672
      targetPort: 15672

    - name: prometheus
      port: 15692
      targetPort: 15692
